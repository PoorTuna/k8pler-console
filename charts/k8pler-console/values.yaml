replicaCount: 2

image:
  repository: poortuna/k8pler-console
  # -- No release pipeline publishes a tag matching Chart.yaml's appVersion;
  # -- "latest" is the only tag actually pushed to Docker Hub. Pin an exact
  # -- tag for anything beyond a quick try.
  tag: "latest"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# -- Console (bridge) configuration, rendered into container args
console:
  # -- One of: okd, openshift, ocp, online, dedicated, azure, rosa
  branding: okd
  customProductName: "k8pler"
  customLogo:
    # -- Replace the masthead logo (which otherwise falls back to the
    # -- OKD/OpenShift/etc. mark selected by console.branding) with the
    # -- bundled k8pler logo (files/logo.png), or with customLogo.data below.
    enabled: true
    # -- Base64-encoded logo image (any format Go's net/http content-sniffing
    # -- recognizes, e.g. PNG/SVG/JPEG). Overrides the bundled logo when set.
    # -- Generate with: base64 -w0 your-logo.png
    data: ""
  # -- Public base URL the console is reachable at, e.g. https://console.example.com
  # -- Auto-derived from ingress.host + tls when left empty.
  baseAddress: ""
  basePath: "/"
  # -- Bind address:port the bridge listens on inside the pod. The scheme is
  # -- ignored -- it's always overridden to match tls.enabled, so the bridge
  # -- can never end up serving plain HTTP while tls.cert/key are configured
  # -- (or vice versa).
  listen: "http://0.0.0.0:9000"
  port: 9000
  documentationBaseUrl: ""
  statuspageId: ""
  # -- Where per-user console preferences are stored. localstorage avoids
  # -- needing a ConfigMap in the openshift-console-user-settings namespace,
  # -- which doesn't exist on plain k8s.
  userSettingsLocation: localstorage
  # -- console.plugins map: plugin-name -> plugin-endpoint-url
  plugins: {}
  # -- Raw JSON string for --plugin-proxy
  pluginProxy: ""
  # -- Comma-separated i18n namespaces for dynamic plugins
  i18nNamespaces: ""

# -- User authentication. type: oidc | disabled
auth:
  type: oidc

  oidc:
    # -- Must match dex.issuerUrl when dex.enabled=true
    issuerUrl: ""
    clientId: "console"
    # -- Inlined as a generated Secret when set. Prefer existingSecret for production.
    clientSecret: ""
    # -- Reference an existing Secret instead of auth.oidc.clientSecret
    existingSecret: ""
    existingSecretKey: "client-secret"
    # -- Extra OIDC scopes to request ID tokens with
    tokenScopes: []
    # -- External `oc login` command shown in the console's "Copy Login Command" dialog
    ocLoginCommand: ""

  disabled:
    # -- DEV ONLY. Static bearer token used for every request when auth.type=disabled.
    staticBearerToken: ""

# -- Metrics wiring for the Nodes list, Utilization dashboards, and Observe
# -- pages. type: disabled | bundled | external
monitoring:
  type: disabled

  # -- Required (and only meaningful) when monitoring.type=bundled: gates the
  # -- kube-prometheus-stack dependency below. Helm dependency `condition`
  # -- can only reference a plain boolean value, not monitoring.type directly
  # -- -- keep this in sync with monitoring.type=bundled, or helm template
  # -- will fail loudly (see templates/_validations.tpl).
  bundledEnabled: false

  # -- Used when monitoring.type=external: point at a Prometheus/Alertmanager
  # -- you already run (e.g. one already scraping other workloads on this
  # -- cluster) instead of bundling kube-prometheus-stack.
  external:
    # -- host:port, e.g. prometheus-operated.monitoring.svc:9090
    prometheusHost: ""
    prometheusScheme: http
    # -- host:port, e.g. alertmanager-operated.monitoring.svc:9093
    alertmanagerHost: ""
    alertmanagerScheme: http

  # -- Optional upstream service public URLs for "open in Prometheus/Grafana"
  # -- links. Independent of monitoring.type -- leave unset to hide the links.
  prometheusPublicUrl: ""
  grafanaPublicUrl: ""
  thanosPublicUrl: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""
  # -- Bind system:auth-delegator so the bridge can validate bearer tokens via
  # -- TokenReview, regardless of auth.type. Required.
  bindAuthDelegator: true

service:
  type: ClusterIP
  # -- Set to 443 + tls.enabled to terminate TLS at the console pod itself
  # -- instead of at an Ingress.
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  #  cert-manager.io/cluster-issuer: letsencrypt
  host: console.example.com
  path: /
  pathType: Prefix
  tls:
    enabled: false
    secretName: ""

tls:
  # -- Serve HTTPS directly from the bridge (in addition to, or instead of,
  # -- TLS-terminating Ingress). Requires existingSecret with tls.crt/tls.key.
  enabled: false
  existingSecret: ""

resources: {}
  # limits:
  #   cpu: 500m
  #   memory: 512Mi
  # requests:
  #   cpu: 100m
  #   memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}

podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

# -- Extra raw bridge CLI flags, appended verbatim (e.g. ["--telemetry=foo=bar"])
extraArgs: []
extraEnv: []
extraVolumes: []
extraVolumeMounts: []

# -- Bundled Dex OIDC provider. Meant for quick starts / dev; for production,
# -- run Dex (or any other OIDC provider) separately and point auth.oidc.issuerUrl
# -- at it instead.
dex:
  enabled: false

  image:
    repository: ghcr.io/dexidp/dex
    tag: v2.41.1
    pullPolicy: IfNotPresent

  # -- Must match auth.oidc.issuerUrl when enabled
  issuerUrl: ""

  # -- Dex staticClients entries. Defaults to a single "console" client wired
  # -- to auth.oidc.clientId/clientSecret and ingress.host when left empty.
  staticClients: []

  # -- Dev-only fallback identity source (bcrypt password hashes). Prefer a
  # -- real connector below for anything beyond a demo.
  staticPasswords: []
  #  - email: admin@example.com
  #    hash: "$2a$10$..."   # htpasswd -bnBC 10 "" 'yourpassword' | tr -d ':\n'
  #    username: admin
  #    userID: 08a8684b-db88-4b73-90a9-3cd1661f5466

  # -- Raw Dex connector config objects (LDAP, GitHub, upstream OIDC, SAML...)
  # -- https://dexidp.io/docs/connectors/
  connectors: []

  resources: {}

  service:
    port: 5556

  ingress:
    enabled: false
    className: ""
    annotations: {}
    host: dex.example.com
    tls:
      enabled: false
      secretName: ""

# -- Tenancy-enforcement proxy fronting the effective Prometheus (bundled or
# -- external), deployed whenever monitoring.type != disabled. Replicates
# -- OpenShift's thanos-querier sidecar pair: kube-rbac-proxy authenticates
# -- the request and checks (via SubjectAccessReview) that the caller can
# -- `get` the `namespaces` resource named in the request's `namespace=`
# -- query param, then prom-label-proxy injects that namespace as an actual
# -- PromQL label matcher before forwarding to Prometheus. Only the
# -- Prometheus tenancy path goes through this proxy -- Alertmanager's
# -- tenancy path is a plain host mapping (see monitoring.external.alertmanagerHost
# -- and the README's "Bundled monitoring" section for why).
metricsProxy:
  image:
    kubeRbacProxy:
      repository: quay.io/brancz/kube-rbac-proxy
      tag: v0.18.1
      pullPolicy: IfNotPresent
    promLabelProxy:
      repository: quay.io/prometheuscommunity/prom-label-proxy
      tag: v0.11.1
      pullPolicy: IfNotPresent
  resources: {}

# -- Bundled kube-prometheus-stack (Prometheus + Alertmanager + node-exporter
# -- + kube-state-metrics + Grafana), deployed as a real Helm dependency when
# -- monitoring.type=bundled (also requires monitoring.bundledEnabled=true --
# -- see the comment on that field). Values below pass straight through to
# -- that chart -- see
# -- https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-prometheus-stack
# -- for the full reference. Trimmed down here for a single-node cluster;
# -- override anything for a larger deployment.
kube-prometheus-stack:
  grafana:
    enabled: true
  prometheus:
    prometheusSpec:
      retention: 7d
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 1Gi
  alertmanager:
    alertmanagerSpec:
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
  # kube-scheduler's /metrics/resources endpoint (kube_pod_resource_request/
  # kube_pod_resource_limit, used by the Nodes list's request/limit columns)
  # isn't reliably scrapeable on k3s's embedded scheduler -- leaving this
  # ServiceMonitor on is harmless (just won't find targets) but disable it if
  # it's noisy in your setup.
  kubeScheduler:
    enabled: true
  # The console's Cluster/Project Utilization dashboards join node-exporter
  # metrics against kube_node_role `on(instance)`, after rewriting
  # kube_node_role's own `instance` label to the k8s Node's *name* (not
  # node-exporter's default ip:port scrape-target instance label). Without
  # this relabeling, that join always returns empty -- node-exporter's raw
  # `instance` label never matches. This is the same relabeling OpenShift's
  # own node-exporter is configured with, replicated here for a vanilla
  # kube-prometheus-stack install.
  prometheus-node-exporter:
    prometheus:
      monitor:
        relabelings:
          - sourceLabels: [__meta_kubernetes_pod_node_name]
            targetLabel: instance
