apiVersion: v2
name: k8pler-console
description: >-
  Web console for plain Kubernetes clusters — a de-OpenShift-ed fork of the
  OpenShift Console (release-4.16 UI), authenticating via OIDC. Optionally
  bundles a Dex OIDC provider for quick starts.
type: application
version: 0.1.1
appVersion: "4.16.0"
kubeVersion: ">=1.24.0-0"
home: https://github.com/PoorTuna/k8pler-console
sources:
  - https://github.com/PoorTuna/k8pler-console
keywords:
  - console
  - kubernetes
  - dashboard
  - ui
  - oidc
maintainers:
  - name: PoorTuna
    url: https://github.com/PoorTuna
annotations:
  artifacthub.io/license: Apache-2.0
dependencies:
  - name: kube-prometheus-stack
    version: "88.0.1"
    repository: https://prometheus-community.github.io/helm-charts
    # Helm dependency `condition` can only reference a plain boolean value --
    # keep monitoring.bundledEnabled in sync with monitoring.type=bundled
    # (see templates/_validations.tpl, which fails loudly if they drift).
    condition: monitoring.bundledEnabled
