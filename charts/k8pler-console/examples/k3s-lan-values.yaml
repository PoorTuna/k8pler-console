# One-off values for a first real smoke deploy on a single-node k3s LAN box:
# auth disabled (no OIDC provider stood up yet), exposed via k3s's built-in
# ServiceLB as a LoadBalancer Service (external IP = the node's LAN IP).

replicaCount: 1

console:
  # -- Required for LoadBalancer + no ingress: the chart can't know the node's
  # -- LAN IP in advance. Set this to the real address before installing --
  # -- get it with `kubectl get svc` after a first install if you don't know
  # -- it yet, then upgrade with the corrected value.
  baseAddress: "http://REPLACE_WITH_NODE_IP:9000"

image:
  repository: poortuna/k8pler-console
  tag: latest
  pullPolicy: Always

auth:
  type: disabled
  disabled:
    staticBearerToken: "REPLACE_WITH_A_REAL_TOKEN"

service:
  type: LoadBalancer
  port: 9000

ingress:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 384Mi
