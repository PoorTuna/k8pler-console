{{- if .Values.dex.enabled -}}
{{- include "k8pler-console.validate" . -}}
# Rendered as a Secret, not a ConfigMap: staticClients[].secret (the OIDC
# client secret) is a real credential and would otherwise sit in plaintext
# in a world-readable ConfigMap.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "k8pler-console.dex.fullname" . }}
  labels:
    {{- include "k8pler-console.dex.labels" . | nindent 4 }}
type: Opaque
stringData:
  config.yaml: |
    issuer: {{ include "k8pler-console.dex.issuerUrl" . }}

    storage:
      type: kubernetes
      config:
        inCluster: true

    web:
      http: 0.0.0.0:{{ .Values.dex.service.port }}

    staticClients:
      {{- if .Values.dex.staticClients }}
      {{- toYaml .Values.dex.staticClients | nindent 6 }}
      {{- else }}
      - id: {{ .Values.auth.oidc.clientId }}
        name: {{ include "k8pler-console.fullname" . }}
        secret: {{ .Values.auth.oidc.clientSecret | quote }}
        redirectURIs:
          - {{ printf "%s/auth/callback" (include "k8pler-console.baseAddress" .) }}
      {{- end }}

    {{- if .Values.dex.staticPasswords }}
    enablePasswordDB: true

    staticPasswords:
      {{- toYaml .Values.dex.staticPasswords | nindent 6 }}
    {{- end }}

    {{- if .Values.dex.connectors }}
    connectors:
      {{- toYaml .Values.dex.connectors | nindent 6 }}
    {{- end }}
{{- end }}
