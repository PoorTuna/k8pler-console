{{- if .Values.dex.enabled -}}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "k8pler-console.fullname" . }}-test-dex-connection"
  labels:
    {{- include "k8pler-console.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  containers:
    - name: wget
      image: busybox:1.36
      command: ['wget']
      args:
        - '--spider'
        - '--timeout=5'
        - 'http://{{ include "k8pler-console.dex.fullname" . }}:{{ .Values.dex.service.port }}/.well-known/openid-configuration'
  restartPolicy: Never
{{- end }}
