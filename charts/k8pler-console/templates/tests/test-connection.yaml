apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "k8pler-console.fullname" . }}-test-connection"
  labels:
    {{- include "k8pler-console.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  containers:
    - name: wget
      image: busybox:1.36
      command: ['wget']
      args:
        - '--spider'
        - '--timeout=5'
        {{- if .Values.tls.enabled }}
        - '--no-check-certificate'
        {{- end }}
        - '{{ .Values.tls.enabled | ternary "https" "http" }}://{{ include "k8pler-console.fullname" . }}:{{ .Values.service.port }}/health'
  restartPolicy: Never
