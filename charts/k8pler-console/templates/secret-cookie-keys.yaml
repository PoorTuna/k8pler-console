{{- if eq .Values.auth.type "oidc" -}}
{{/*
The bridge hard-requires --cookie-encryption-key-file and
--cookie-authentication-key-file whenever --user-auth=oidc
(cmd/bridge/config/session/sessionoptions.go) -- it won't start without
them. Generate both once and keep them stable across `helm upgrade` (via
`lookup`) so an upgrade never invalidates every live session by rotating
the keys out from under them.
*/}}
{{- $secretName := printf "%s-cookie-keys" (include "k8pler-console.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $encryptionKey := randAlphaNum 32 }}
{{- $authenticationKey := randAlphaNum 32 }}
{{- if $existing }}
{{- $encryptionKey = index $existing.data "encryption-key" | b64dec }}
{{- $authenticationKey = index $existing.data "authentication-key" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "k8pler-console.labels" . | nindent 4 }}
type: Opaque
stringData:
  encryption-key: {{ $encryptionKey | quote }}
  authentication-key: {{ $authenticationKey | quote }}
{{- end }}
