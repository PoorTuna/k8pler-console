{{- if and .Values.serviceAccount.create .Values.serviceAccount.bindAuthDelegator -}}
# The bridge unconditionally builds a TokenReviewer (cmd/bridge/main.go) to
# validate bearer tokens against the API server, regardless of auth.type.
# system:auth-delegator grants exactly that (create on authentication.k8s.io
# TokenReview + authorization.k8s.io SubjectAccessReview).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "k8pler-console.fullname" . }}-auth-delegator
  labels:
    {{- include "k8pler-console.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: {{ include "k8pler-console.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
