apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8pler-console
  namespace: k8pler-console
---
# The bridge unconditionally builds a TokenReviewer (cmd/bridge/main.go) to
# validate bearer tokens against the API server, regardless of --user-auth
# mode. system:auth-delegator grants exactly that (create on
# authentication.k8s.io TokenReview + authorization.k8s.io
# SubjectAccessReview).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8pler-console-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: k8pler-console
    namespace: k8pler-console
