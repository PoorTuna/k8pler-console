apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dex
  namespace: k8pler-console
  annotations:
    # Adjust/remove for your ingress controller. TLS is required: OIDC
    # issuer URLs and redirects must be https.
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["dex.k8pler.example.com"]
      secretName: dex-tls
  rules:
    - host: dex.k8pler.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dex
                port:
                  name: http
